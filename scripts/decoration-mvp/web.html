<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店铺装修预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f4f0;color:#292d28;font-family:system-ui,'Microsoft YaHei',sans-serif}main{max-width:1200px;margin:auto;padding:36px 24px}h1{font-size:30px;margin:8px 0}p{color:#697066;line-height:1.7}small{color:#71796c}header{margin-bottom:26px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px}.panel{background:white;border:1px solid #e3e6df;border-radius:18px;padding:24px;margin-bottom:20px}h2{font-size:19px;margin:0 0 18px}.row{display:flex;gap:14px}.row>*{flex:1;min-width:0}label{display:block;font-size:14px;margin-bottom:16px}input,select{display:block;width:100%;padding:11px;border:1px solid #d8ddd4;border-radius:8px;margin-top:7px;background:white;font:inherit}input[type=file]{font-size:12px}button,.download{background:#315441;color:white;border:0;border-radius:9px;padding:13px 20px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}button:disabled{opacity:.55;cursor:wait}.product{padding-top:18px;border-top:1px solid #e8eae5}.thumb{width:84px;height:84px;object-fit:cover;border-radius:10px;background:#eee;margin-bottom:12px}.thumb:not([src]){display:none}.preview{width:100%;display:block}.preview:not([src]){display:none}aside .panel{position:sticky;top:24px}.status{white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#a23434}a{color:#315441}#empty{padding:60px 10px;text-align:center;border:1px dashed #ccd5c8;border-radius:12px}#links a{display:block;margin:14px 0} @media(max-width:850px){.layout{grid-template-columns:1fr}aside .panel{position:static}.row{flex-wrap:wrap}}</style>
<main><header><small>微购相册 · 装修小样</small><h1>把商品放进店铺，看看效果</h1><p>选择商品和模块组合，由模型直接生成一张完整店铺长图。</p></header><div class="layout"><form id="form">
<section class="panel"><h2>1. 店铺信息</h2><div class="row"><label>店铺昵称<input name="nickname" required maxlength="30" placeholder="例如：心意彩妆礼盒"></label><label>头像（选填）<input name="avatar" type="file" accept="image/jpeg,image/png,image/webp"></label></div><small>保留固定三角形背景；未上传头像时使用昵称首字。</small></section>
<section class="panel"><h2>2. 选择3件商品</h2><div id="products"></div><small>使用完整商品原图作参考，价格选填。</small></section>
<section class="panel"><h2>3. 组合模块</h2><p>招牌、权益栏和四个导航固定在顶部。下面三个模块可调整顺序。</p><div class="row"><label>第一个模块<select name="module0"><option value="carousel">轮播</option><option value="posters">三张海报</option><option value="products">商品橱窗</option></select></label><label>第二个模块<select name="module1"><option value="posters">三张海报</option><option value="carousel">轮播</option><option value="products">商品橱窗</option></select></label><label>第三个模块<select name="module2"><option value="products">商品橱窗</option><option value="carousel">轮播</option><option value="posters">三张海报</option></select></label></div><label>商品橱窗列数<select name="columns"><option value="3">三列</option><option value="2">两列</option></select></label><p>当前由助手执行生图。提交后把任务路径发给助手，直接获得完整长图，无需上传场景图或拼接。</p><button id="submit" type="submit">准备整页生图任务</button><p id="status" class="status" aria-live="polite"></p><div id="links"></div></section></form><aside><section class="panel"><h2>完整页面预览</h2><p id="empty">拿到助手生成的整页图片后，可在此打开查看。<input id="wholeFile" type="file" accept="image/png,image/jpeg,image/webp" aria-label="打开整页生成结果"></p><img id="preview" class="preview" alt="生成的完整装修预览"><p><small>采用前请检查商品外观、包装小字、裁切和价格。</small></p></section></aside></div></main>
<script>
const form=document.querySelector('#form'),status=document.querySelector('#status'),submit=document.querySelector('#submit'),links=document.querySelector('#links');
for(let i=0;i<3;i++){document.querySelector('#products').insertAdjacentHTML('beforeend',`<article class="product"><h3>商品 ${i+1}</h3><img class="thumb" id="thumb${i}" alt="商品${i+1}裁切示意"><label>商品图片<input type="file" name="product${i}" required accept="image/jpeg,image/png,image/webp"></label><div class="row"><label>商品名称<input name="name${i}" required maxlength="60" placeholder="填写商品名称"></label><label>价格（元）<input name="price${i}" inputmode="decimal" pattern="[0-9]{1,7}(\\.[0-9]{1,2})?" placeholder="可留空"></label></div></article>`);
 const input=form.elements['product'+i],thumb=document.querySelector('#thumb'+i);input.onchange=()=>{if(thumb.src)URL.revokeObjectURL(thumb.src);if(input.files[0])thumb.src=URL.createObjectURL(input.files[0]);else thumb.removeAttribute('src');};
}
function label(){submit.textContent='准备整页生图任务';}
document.querySelector('#wholeFile').onchange=e=>{const f=e.target.files[0];if(f){const p=document.querySelector('#preview');if(p.src.startsWith('blob:'))URL.revokeObjectURL(p.src);p.src=URL.createObjectURL(f);}};
form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;status.classList.remove('error');status.textContent='正在处理，请稍候…';links.replaceChildren();document.querySelector('#preview').removeAttribute('src');document.querySelector('#empty').hidden=false;
 try{const response=await fetch('/api/preview',{method:'POST',body:new FormData(form)});const result=await response.json();if(!response.ok)throw new Error(result.error);const a=document.createElement('a');a.href=result.prompt;a.textContent='查看生图提示词';a.target='_blank';links.append(a);
 if(result.preview){document.querySelector('#preview').src=result.preview;document.querySelector('#empty').hidden=true;const download=document.createElement('a');download.href=result.preview;download.download='店铺装修预览.png';download.textContent='下载完整预览图';links.append(download);status.textContent='预览已完成，检查效果后即可下载。';}
 else{status.textContent='整页生图任务已准备好（尚未调用模型）。把下面的路径发给助手，即可按所选组合直接生成整页。\n'+result.directory;}
 }catch(error){status.classList.add('error');status.textContent=error.message;}finally{submit.disabled=false;label();}};
</script></html>
