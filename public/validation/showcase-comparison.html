<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>单列橱窗修复对照</title><style>*{box-sizing:border-box}body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#edf1ee;margin:24px;color:#17241e}h1{font-size:26px}p{line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:16px}.panel{background:white;padding:12px;border-radius:10px}h2{font-size:16px}.reference{width:100%}.panel p{font-size:13px;color:#66766b}.store-showcase{background:#fff;padding:9px;display:grid;gap:7px;width:100%;box-sizing:border-box}
.store-showcase.single{grid-template-columns:minmax(0,1fr)}
.store-showcase.double{grid-template-columns:repeat(2,minmax(0,1fr))}
.store-showcase.triple{grid-template-columns:repeat(3,minmax(0,1fr))}
.store-showcase.slider{display:flex;overflow:hidden}
.store-showcase.slider article{flex:0 0 31%}
.store-showcase article{min-width:0;background:#fff}
.store-showcase img,.store-showcase .showcase-loading{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover}
.store-showcase .showcase-loading{display:grid;place-items:center;background:#e3e8e5;color:#829088}
.store-showcase strong{display:block;margin-top:4px;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store-showcase .showcase-price{font-size:9px;color:#ed5f4e;display:flex;align-items:center;justify-content:space-between;margin-top:3px;min-height:11px}
.store-showcase .showcase-price svg{flex:none}
