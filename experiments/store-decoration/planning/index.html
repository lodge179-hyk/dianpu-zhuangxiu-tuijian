<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店铺装修 · 方案与素材</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.7 "Microsoft YaHei",sans-serif;color:#25382f;background:#f2f4f0}header{padding:24px 32px;background:#fff;border-bottom:1px solid #dfe4dc;display:flex;align-items:center;justify-content:space-between;gap:24px}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 10px}h3{font-size:14px;margin:0 0 8px}p{margin:8px 0}.muted{color:#6f7b71}.shell{max-width:1320px;margin:24px auto;padding:0 24px;display:grid;grid-template-columns:minmax(320px,1fr) 525px;gap:28px;align-items:start}.card{background:#fff;border:1px solid #dde3d9;border-radius:10px;padding:22px;margin-bottom:18px}.steps{font-size:12px;letter-spacing:.5px;color:#6e786f}button,.file-button{font:inherit;cursor:pointer;background:#fff;border:1px solid #b8c4b7;border-radius:6px;padding:9px 14px;color:#294530}button.primary{background:#294f3b;color:#fff;border-color:#294f3b}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}input[type=file]{max-width:100%;font:inherit}textarea{width:100%;min-height:150px;border:1px solid #ccd6c8;border-radius:5px;font:12px/1.6 monospace;padding:10px}pre{white-space:pre-wrap;word-break:break-word;background:#f5f7f3;font-size:12px;padding:12px;max-height:360px;overflow:auto}details{margin:10px 0}summary{cursor:pointer;color:#41614d}.error{color:#9a382b;background:#fff0ed;padding:12px;border-radius:5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.stat{background:#f2f5ef;border-radius:6px;padding:12px 6px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:#6c786d}.module{padding:12px 0;border-top:1px solid #e9ede6}.module small{color:#778174;display:block}.palette{display:flex;gap:8px;margin:12px 0}.swatch{width:30px;height:30px;border:1px solid #cbd3c7;border-radius:50%}.batch{border:1px solid #dce3d7;padding:14px;border-radius:8px;margin-top:12px}.badge{display:inline-block;font-size:11px;background:#e7eee2;padding:3px 8px;border-radius:4px}.preview-head{padding:16px 20px;background:white;border:1px solid #dde3d9;border-radius:10px 10px 0 0}.preview{background:#e4e9e1;padding:20px;width:525px;overflow-x:auto}iframe{border:0;background:#fff;width:483px;display:block;box-shadow:0 3px 14px #1e30131c}.placeholder{padding:90px 24px;text-align:center;background:#fff;color:#788273;min-height:520px}.notice{font-size:12px;padding:10px 12px;background:#f3f5ef;border-left:3px solid #99ac89;margin:12px 0}.hidden{display:none!important}a{color:#335d41}#status{margin-top:12px}ol{padding-left:20px}@media(max-width:1000px){.shell{display:block;max-width:620px}.preview{max-width:100%}header{display:block;padding:20px}.steps{margin-top:8px}}
</style></head><body>
<header><div><h1>店铺装修 · 方案与素材</h1><div class="muted">固定模块，少量总图，组合成完整店铺参考</div></div><div class="steps">理解店铺 → 安排模块与素材 → 批量生图 → 裁剪填入</div></header>
<div class="shell"><section>
<div class="card"><h2>从一张店铺截图开始</h2><p class="muted">无需选择风格。AI 根据能辨识的店铺信息规划；截图里的小商品图不会被当作必须提取的素材。</p><input id="screenshot" type="file" accept="image/png,image/jpeg,image/webp"><div class="actions"><button id="plan" class="primary">分析截图并规划</button><button id="example">查看已存素材示例</button></div><div id="config" class="muted"></div><div id="status" role="status" aria-live="polite"></div>
<details><summary>其他 AI 接力入口</summary><p class="muted">把规划说明与截图交给其他 AI，再导入它返回的方案 JSON。生图提示词会随方案生成。</p><button id="prompt">查看规划说明</button><pre id="instructions" class="hidden"></pre><textarea id="import" placeholder="粘贴方案 JSON" aria-label="导入方案 JSON"></textarea><button id="import-button">导入方案</button></details></div>
<div id="summary" class="card hidden"></div><div id="modules" class="card hidden"></div><div id="batches" class="card hidden"></div>
</section><section><div class="preview-head"><h2>完整店铺参考</h2><div id="preview-note" class="muted">先生成方案，或打开已有示例。</div></div><div class="preview"><div id="empty" class="placeholder">页面会使用已封装的真实模块样式<br>素材尚未填入时显示黑色占位图</div><iframe id="frame" class="hidden" title="店铺装修参考" sandbox="allow-scripts allow-same-origin"></iframe></div></section></div>
<script>
const $=id=>document.getElementById(id);let current=null,poll=null,busy=false;
const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;};
function status(text,error=false){$('status').textContent=text;$('status').className=error?'error':'muted';}
function lock(value){busy=value;for(const id of ['plan','example','import-button'])$(id).disabled=value;}
async function api(url,options={}){const response=await fetch(url,options);const value=await response.json();if(!response.ok)throw Error(value.error||'操作未完成');return value;}
function reveal(id){const node=$(id);node.replaceChildren();node.classList.remove('hidden');return node;}
function show(state){
 current=state;localStorage.setItem('store-planning-run',state.id);clearTimeout(poll);
 if(state.status==='planning'){lock(true);status('正在理解截图并安排模块与素材，请稍候。只发起一次规划请求。');poll=setTimeout(()=>refresh(state.id),1800);return;}
 lock(false);
 if(state.status==='failed'){status(state.error,true);return;}
 status(state.source==='saved-example'?'已载入保存的素材。这次没有调用AI。':state.filledAssets.length===state.plan.assets.length?'素材已全部填入，可以查看完整店铺参考。':'方案已就绪。黑色区域等待批量素材填入。');
 const p=state.plan,s=reveal('summary');s.append(el('span',state.source==='saved-example'?'已有素材演示':'装修方案','badge'),el('h2',p.shop.name),el('p',p.summary));
 const stats=el('div',undefined,'stats');for(const [number,label]of [[state.metrics.modules,'模块'],[state.metrics.imageSlots,'图片槽位'],[state.metrics.uniqueAssets,'独立素材'],[state.metrics.generationCalls,'计划生图批次']]){const n=el('div',undefined,'stat');n.append(el('b',String(number)),el('span',label));stats.append(n);}s.append(stats);
 const palette=el('div',undefined,'palette');for(const color of p.style.palette){const n=el('span',undefined,'swatch');n.style.backgroundColor=color;n.title=color;palette.append(n);}s.append(palette,el('p',p.style.background+'；'+p.style.lighting+'；'+p.style.photography));
 const observations=el('details');observations.append(el('summary','店铺理解与不确定信息'));for(const text of [...p.shop.observations,...p.shop.uncertainties])observations.append(el('p',text,'muted'));s.append(observations);
 if(state.warnings.length){const d=el('details');d.append(el('summary','构图适配提醒（'+state.warnings.length+'）'));for(const w of state.warnings)d.append(el('p',w,'muted'));s.append(d);}
 const data=el('details');data.append(el('summary','查看完整方案 JSON'),el('pre',JSON.stringify(p,null,2)));s.append(data);
 const modules=reveal('modules');modules.append(el('h2','模块安排'));for(const m of p.modules){const row=el('div',undefined,'module');row.append(el('strong',m.purpose),el('small',m.type),el('small',m.props.assetIds.length?'素材：'+m.props.assetIds.join(' / '):'使用平台固定内容或文字'));modules.append(row);}
 const batches=reveal('batches');batches.append(el('h2','批量素材'),el('p','每批只生成一张总图。将下面的提示词交给生图 AI，再上传总图，程序会裁剪并填入。','muted'),el('p','这里不自动调用生图服务；已填入 '+state.filledAssets.length+' / '+p.assets.length+' 张素材。','notice'));
 for(const batch of state.batches){
  const box=el('div',undefined,'batch');box.append(el('h3',batch.id+' · '+batch.panelCount+' 张素材'),el('p','行分配：'+batch.rows.map(r=>r.length+'张').join(' → '),'muted'));
  if(batch.referenceBatchId)box.append(el('p','生图时同时提供 '+batch.referenceBatchId+' 的总图作为风格参考。','notice'));
  const detail=el('details');detail.append(el('summary','查看完整生图提示词'),el('pre',batch.prompt));box.append(detail);
  const copy=el('button','复制提示词');copy.onclick=async()=>{try{await navigator.clipboard.writeText(batch.prompt);status('已复制 '+batch.id+' 的提示词。');}catch{detail.open=true;status('请在展开的提示词中复制文本。');}};
  const upload=document.createElement('input');upload.type='file';upload.accept='image/png,image/jpeg,image/webp';upload.setAttribute('aria-label','上传'+batch.id+'总图');upload.onchange=async()=>{
   const file=upload.files[0];if(!file)return;if(file.size>30*1024*1024){status('图片超过30MB。',true);return;}
   upload.disabled=true;lock(true);status('正在识别分隔带、裁剪并填入 '+batch.id+'…');
   try{show(await api('/api/runs/'+state.id+'/batches/'+batch.id,{method:'POST',headers:{'Content-Type':file.type},body:file}));status(batch.id+' 已裁剪填入；没有新调用生图模型。');}catch(e){status(e.message,true);}finally{upload.disabled=false;lock(false);}
  };
  const actions=el('div',undefined,'actions');actions.append(copy,upload);box.append(actions);
  if(state.importedBatches.includes(batch.id))box.append(el('p','本批次已填入','badge'));
  for(const crop of state.cropReports?.[batch.id]?.crops||[])if(crop.framingReviewRequired)box.append(el('p',crop.assetId+' 为小尺寸品类素材，裁剪去掉约'+crop.removedAreaPercent+'%面积，请检查主体是否保留。','notice'));
  batches.append(box);
 }
 $('preview-note').textContent=state.source==='saved-example'?'复用已存素材的参考效果；商品为示意，价格留空。':state.filledAssets.length===p.assets.length?'素材已全部填入；商品为装修示意，仍需你检验效果。':'黑色区域是待生成素材；固定模块与顺序已按方案显示。';
 $('empty').classList.add('hidden');$('frame').classList.remove('hidden');$('frame').style.height=Math.ceil(state.layout.height)+'px';$('frame').src=state.preview+'?t='+Date.now();
}
async function refresh(id){try{const state=await api('/api/runs/'+id);if(current?.id===id)show(state);}catch(e){lock(false);status(e.message,true);}}
$('plan').onclick=async()=>{const file=$('screenshot').files[0];if(!file){status('先选择一张店铺截图。',true);return;}if(file.size>30*1024*1024){status('截图超过30MB。',true);return;}lock(true);status('正在上传截图…');try{show(await api('/api/plan',{method:'POST',headers:{'Content-Type':file.type},body:file}));}catch(e){lock(false);status(e.message,true);}};
$('example').onclick=async()=>{lock(true);try{show(await api('/api/example',{method:'POST'}));}catch(e){status(e.message,true);lock(false);}};
$('import-button').onclick=async()=>{lock(true);try{const value=JSON.parse($('import').value);show(await api('/api/import-plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)}));}catch(e){status(e.message,true);lock(false);}};
$('prompt').onclick=async()=>{try{$('instructions').textContent=(await api('/api/planner-prompt')).prompt;$('instructions').classList.remove('hidden');}catch(e){status(e.message,true);}};
api('/api/config').then(c=>{$('config').textContent=c.plannerConfigured?'支持PNG/JPG/WebP，最多30MB。':'截图规划模型未配置；可先看示例，或导入其他AI的方案。';}).catch(e=>status(e.message,true));
const linkedRun=new URLSearchParams(location.search).get('run');
const previous=linkedRun&&/^[a-f0-9-]{36}$/.test(linkedRun)?linkedRun:localStorage.getItem('store-planning-run');if(previous){current={id:previous};refresh(previous);}
</script></body></html>
